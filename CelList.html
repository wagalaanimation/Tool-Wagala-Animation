<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Production Workflow Tracker - Wagala Animation</title>
  <style>
    :root {
      --bg-main: #18111E;
      --bg-card: #241B2C;
      --bg-inner: #2D2237;
      --bg-input: #150F1A;
      --border-color: #382B44;
      --accent-purple: #A882DD;
      --accent-glow: rgba(168, 130, 221, 0.15);
      --text-primary: #F3EFF6;
      --text-secondary: #9E92A8;
      --text-muted: #685C73;
      --danger-bg: #3D1E26;
      --danger-border: #7A3242;
      --danger-text: #F87171;
      --success-color: #4ADE80;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 24px;
      line-height: 1.5;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Header & Tombol Atas */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 24px;
    }

    .btn {
      background-color: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      padding: 9px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover {
      border-color: var(--accent-purple);
      background-color: var(--bg-inner);
    }

    .btn-accent {
      background-color: transparent;
      border: 1px solid var(--accent-purple);
      color: var(--accent-purple);
    }

    .btn-accent:hover {
      background-color: var(--accent-glow);
      color: #fff;
    }

    .btn-danger {
      background-color: var(--danger-bg);
      border-color: var(--danger-border);
      color: var(--danger-text);
    }

    .btn-danger:hover {
      background-color: #522430;
    }

    /* Global Matrix / Progress Utama */
    .global-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 24px;
    }

    .section-title {
      color: var(--accent-purple);
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .part-input-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .part-input-wrapper label {
      font-size: 13px;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    input[type="text"] {
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      width: 100%;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--accent-purple);
    }

    input[type="text"]::placeholder {
      color: var(--text-muted);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 18px;
    }

    .stat-box {
      background-color: var(--bg-inner);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 16px;
      text-align: center;
    }

    .stat-label {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 24px;
      font-weight: 700;
      color: var(--accent-purple);
    }

    /* Progress Bar */
    .progress-wrapper {
      width: 100%;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .progress-track {
      width: 100%;
      height: 10px;
      background-color: var(--bg-input);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #7C52B8, #B794F4);
      width: 0%;
      transition: width 0.3s ease;
    }

    .progress-fill.complete {
      background: linear-gradient(90deg, #22C55E, #4ADE80);
    }

    /* Form Tambah Kategori */
    .add-category-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }

    /* Grid Kategori */
    .categories-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 20px;
    }

    .category-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      border-left: 3px solid var(--accent-purple);
    }

    .cat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .cat-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
      cursor: pointer;
      word-break: break-word;
    }

    .cat-title:hover {
      color: var(--accent-purple);
    }

    .icon-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn-icon {
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      width: 28px;
      height: 28px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      transition: 0.2s;
    }

    .btn-icon:hover {
      border-color: var(--accent-purple);
      color: var(--text-primary);
    }

    .btn-icon.del:hover {
      background-color: var(--danger-bg);
      border-color: var(--danger-border);
      color: var(--danger-text);
    }

    /* List Item */
    .task-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 280px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .task-list::-webkit-scrollbar {
      width: 5px;
    }
    .task-list::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 4px;
    }

    .task-item {
      background-color: var(--bg-inner);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 9px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      transition: 0.2s;
    }

    .task-item.done {
      opacity: 0.6;
      background-color: var(--bg-input);
    }

    .task-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 0;
    }

    .task-checkbox {
      appearance: none;
      width: 18px;
      height: 18px;
      border: 1.5px solid var(--accent-purple);
      border-radius: 5px;
      background-color: var(--bg-input);
      cursor: pointer;
      flex-shrink: 0;
      position: relative;
    }

    .task-checkbox:checked {
      background-color: var(--accent-purple);
    }

    .task-checkbox:checked::after {
      content: '✓';
      position: absolute;
      color: #18111E;
      font-size: 12px;
      font-weight: 900;
      left: 3px;
      top: -1px;
    }

    .task-text {
      font-size: 13px;
      color: var(--text-primary);
      word-break: break-word;
    }

    .task-item.done .task-text {
      text-decoration: line-through;
      color: var(--text-secondary);
    }

    .add-task-form {
      display: flex;
      gap: 8px;
      margin-top: auto;
    }

    .add-task-form input {
      padding: 8px 12px;
      font-size: 12px;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      background-color: var(--bg-card);
      border: 1px dashed var(--border-color);
      border-radius: 14px;
    }

    .btn-back {
      background-color: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      padding: 9px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
    }
        .btn-back:hover { color: var(--accent); border-color: var(--accent); box-shadow: var(--accent-glow); transform: translateX(-3px); }

  </style>
</head>
<body>

  <div class="container">
    <!-- Top Navigation -->
    <div class="top-bar">
      <a href="index.html" class="btn-back">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg> KEMBALI
    </a>
      <div style="display: flex; gap: 10px; flex-wrap: wrap;">
        <button class="btn btn-accent" onclick="restartPart()" title="Reset semua centang ke 0% tapi pertahankan struktur kategori & list">
          ↻ Restart Part (Reset Centang)
        </button>
        <button class="btn btn-danger" onclick="clearAllData()" title="Hapus semua kategori dan mulai proyek baru">
          ✕ Hapus Semua
        </button>
      </div>
    </div>

    <!-- Global Progress Matrix -->
    <div class="global-card">
      <div class="section-title">
        <span>Production Workflow Matrix</span>
        <span id="statusBadge" style="font-size: 12px; background: var(--bg-inner); padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border-color);">
          In Progress
        </span>
      </div>

      <div class="part-input-wrapper">
        <label for="projectName">Active Scene / Part:</label>
        <input type="text" id="projectName" placeholder="Contoh: Planet Warrior / ARC 1 / Scene 04" oninput="saveProjectName()">
      </div>

      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-label">Total Kategori / Tahapan</div>
          <div class="stat-value" id="totalCategories">0</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Task Selesai</div>
          <div class="stat-value" id="totalTasksCount">0 / 0</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Total Progres Keseluruhan</div>
          <div class="stat-value" id="globalPercentText">0%</div>
        </div>
      </div>

      <div class="progress-wrapper">
        <div class="progress-header">
          <span>Overall Completion</span>
          <span id="globalBarLabel">0% Selesai</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="globalProgressFill"></div>
        </div>
      </div>
    </div>

    <!-- Tambah Kategori Baru -->
    <form class="add-category-bar" onsubmit="addCategory(event)">
      <input type="text" id="newCategoryInput" placeholder="Nama kategori baru (misal: 1. Rough Sketch, 2. Lineart, 3. Coloring, 4. Compositing)..." required>
      <button type="submit" class="btn btn-accent" style="white-space: nowrap;">+ Tambah Kategori</button>
    </form>

    <!-- Container Kategori -->
    <div id="categoriesContainer" class="categories-grid"></div>
  </div>

  <script>
    // Kunci penyimpanan di LocalStorage
    const STORAGE_KEY = 'wagala_animation_workflow_v1';

    // Data default pertama kali dibuka (biar langsung ada gambaran)
    const defaultData = {
      projectName: 'Planet Warrior / ARC 1 / Scene 01',
      categories: [
        {
          id: Date.now() + 1,
          name: '1. Pra-Produksi & Rough',
          tasks: [
            { id: 101, text: 'Cek storyboard & timing dialog', done: true },
            { id: 102, text: 'Bikin keyframe pose utama', done: false },
            { id: 103, text: 'Inbetween kasar & cek gerakan', done: false }
          ]
        },
        {
          id: Date.now() + 2,
          name: '2. Lineart & Coloring',
          tasks: [
            { id: 201, text: 'Clean lineart karakter', done: false },
            { id: 202, text: 'Base color sesuai palet', done: false },
            { id: 203, text: 'Shading & rim light', done: false }
          ]
        }
      ]
    };

    let appData = loadData();

    function loadData() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          return JSON.parse(saved);
        } catch (e) {
          return defaultData;
        }
      }
      return defaultData;
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
      render();
    }

    function saveProjectName() {
      appData.projectName = document.getElementById('projectName').value;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
    }

    // CRUD Kategori
    function addCategory(e) {
      e.preventDefault();
      const input = document.getElementById('newCategoryInput');
      const name = input.value.trim();
      if (!name) return;

      appData.categories.push({
        id: Date.now(),
        name: name,
        tasks: []
      });

      input.value = '';
      saveData();
    }

    function editCategory(catId) {
      const cat = appData.categories.find(c => c.id === catId);
      if (!cat) return;
      const newName = prompt('Ubah nama kategori:', cat.name);
      if (newName !== null && newName.trim() !== '') {
        cat.name = newName.trim();
        saveData();
      }
    }

    function deleteCategory(catId) {
      if (confirm('Hapus kategori ini beserta seluruh list di dalamnya?')) {
        appData.categories = appData.categories.filter(c => c.id !== catId);
        saveData();
      }
    }

    // CRUD Task / List Item
    function addTask(e, catId) {
      e.preventDefault();
      const input = document.getElementById(`task-input-${catId}`);
      const text = input.value.trim();
      if (!text) return;

      const cat = appData.categories.find(c => c.id === catId);
      if (cat) {
        cat.tasks.push({
          id: Date.now(),
          text: text,
          done: false
        });
        input.value = '';
        saveData();
      }
    }

    function toggleTask(catId, taskId) {
      const cat = appData.categories.find(c => c.id === catId);
      if (!cat) return;
      const task = cat.tasks.find(t => t.id === taskId);
      if (task) {
        task.done = !task.done;
        saveData();
      }
    }

    function editTask(catId, taskId) {
      const cat = appData.categories.find(c => c.id === catId);
      if (!cat) return;
      const task = cat.tasks.find(t => t.id === taskId);
      if (!task) return;

      const newText = prompt('Edit item list:', task.text);
      if (newText !== null && newText.trim() !== '') {
        task.text = newText.trim();
        saveData();
      }
    }

    function deleteTask(catId, taskId) {
      const cat = appData.categories.find(c => c.id === catId);
      if (!cat) return;
      cat.tasks = cat.tasks.filter(t => t.id !== taskId);
      saveData();
    }

    // Fitur Restart Part (Reset Centang Saja)
    function restartPart() {
      if (appData.categories.length === 0) return;
      if (confirm('Reset semua centang kembali ke 0% untuk lanjut ke Part / Scene berikutnya? (Daftar kategori & list tetap tersimpan)')) {
        appData.categories.forEach(cat => {
          cat.tasks.forEach(task => {
            task.done = false;
          });
        });
        saveData();
      }
    }

    // Hapus Semua Data
    function clearAllData() {
      if (confirm('Yakin mau hapus SEMUA kategori dan list untuk mulai dari kanvas kosong?')) {
        appData.categories = [];
        saveData();
      }
    }

    // Render UI & Kalkulasi Progress
    function render() {
      document.getElementById('projectName').value = appData.projectName || '';

      const container = document.getElementById('categoriesContainer');
      container.innerHTML = '';

      let totalAllTasks = 0;
      let completedAllTasks = 0;

      if (appData.categories.length === 0) {
        container.innerHTML = `
          <div class="empty-state" style="grid-column: 1 / -1;">
            Belum ada kategori alur kerja. Tambahkan kategori pertamamu di kolom atas!
          </div>
        `;
      }

      appData.categories.forEach(cat => {
        const totalCat = cat.tasks.length;
        const doneCat = cat.tasks.filter(t => t.done).length;
        const percentCat = totalCat === 0 ? 0 : Math.round((doneCat / totalCat) * 100);

        totalAllTasks += totalCat;
        completedAllTasks += doneCat;

        const card = document.createElement('div');
        card.className = 'category-card';

        const tasksHtml = cat.tasks.map(task => `
          <li class="task-item ${task.done ? 'done' : ''}">
            <div class="task-left">
              <input type="checkbox" class="task-checkbox" ${task.done ? 'checked' : ''} onchange="toggleTask(${cat.id}, ${task.id})">
              <span class="task-text">${escapeHtml(task.text)}</span>
            </div>
            <div class="icon-actions">
              <button class="btn-icon" onclick="editTask(${cat.id}, ${task.id})" title="Edit list">✎</button>
              <button class="btn-icon del" onclick="deleteTask(${cat.id}, ${task.id})" title="Hapus list">✕</button>
            </div>
          </li>
        `).join('');

        card.innerHTML = `
          <div class="cat-header">
            <div class="cat-title" onclick="editCategory(${cat.id})" title="Klik untuk ubah nama kategori">
              ${escapeHtml(cat.name)}
            </div>
            <div class="icon-actions">
              <button class="btn-icon" onclick="editCategory(${cat.id})" title="Edit nama kategori">✎</button>
              <button class="btn-icon del" onclick="deleteCategory(${cat.id})" title="Hapus kategori">✕</button>
            </div>
          </div>

          <div class="progress-wrapper">
            <div class="progress-header">
              <span>${doneCat} dari ${totalCat} selesai</span>
              <span style="color: ${percentCat === 100 && totalCat > 0 ? 'var(--success-color)' : 'var(--accent-purple)'}; font-weight: 700;">
                ${percentCat}%
              </span>
            </div>
            <div class="progress-track" style="height: 7px;">
              <div class="progress-fill ${percentCat === 100 && totalCat > 0 ? 'complete' : ''}" style="width: ${percentCat}%;"></div>
            </div>
          </div>

          <ul class="task-list">
            ${tasksHtml || '<li style="font-size: 12px; color: var(--text-muted); text-align: center; padding: 12px 0;">Belum ada list tugas</li>'}
          </ul>

          <form class="add-task-form" onsubmit="addTask(event, ${cat.id})">
            <input type="text" id="task-input-${cat.id}" placeholder="+ Tambah list tugas..." required>
            <button type="submit" class="btn btn-accent" style="padding: 8px 12px;">Tambah</button>
          </form>
        `;

        container.appendChild(card);
      });

      // Update Global Progress
      const globalPercent = totalAllTasks === 0 ? 0 : Math.round((completedAllTasks / totalAllTasks) * 100);
      document.getElementById('totalCategories').textContent = appData.categories.length;
      document.getElementById('totalTasksCount').textContent = `${completedAllTasks} / ${totalAllTasks}`;
      document.getElementById('globalPercentText').textContent = `${globalPercent}%`;
      document.getElementById('globalBarLabel').textContent = `${globalPercent}% Selesai`;

      const globalFill = document.getElementById('globalProgressFill');
      globalFill.style.width = `${globalPercent}%`;
      
      const badge = document.getElementById('statusBadge');
      if (totalAllTasks > 0 && globalPercent === 100) {
        globalFill.classList.add('complete');
        badge.textContent = '✓ Part Selesai!';
        badge.style.color = 'var(--success-color)';
        badge.style.borderColor = 'var(--success-color)';
      } else {
        globalFill.classList.remove('complete');
        badge.textContent = 'In Progress';
        badge.style.color = 'var(--accent-purple)';
        badge.style.borderColor = 'var(--border-color)';
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Jalankan pertama kali
    render();
  </script>
</body>
</html>
